# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-tech0-gen12-07-fe

on:
  push:
    branches:
      - 'main'
    paths:
      - "frontend/**"
      - ".github/workflows/main_app-tech0-gen12-07-fe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Azureへ送るファイルを準備
        working-directory: frontend
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -a .next/standalone/. deploy/
          if [ -d public ]; then
            cp -a public deploy/public
          fi
          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static
          
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-tech0-gen12-07-fe'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_875F173240E6487688C8FAFB684CA2A1 }}